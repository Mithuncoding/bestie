<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00c853">
<title>Will you be my bestie? 💖</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --yes1: #00c853;
    --yes2: #69f0ae;
    --no1: #ff1744;
    --no2: #ff616f;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #ffdde1, #c8e7ff, #ffd6ff, #d0f4ff);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    overflow: hidden;
    padding: 12px;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    width: min(92vw, 520px);
    text-align: center;
    padding: 20px;
    border-radius: 25px;
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(12px);
  }

  .gif {
    width: 150px;
    height: 150px;
    border-radius: 20px;
    margin-bottom: 15px;
  }

  h1 { font-size: 1.8rem; margin-bottom: 10px; }
  .subtext { font-size: 0.95rem; margin-bottom: 15px; }

  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 16px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    max-width: 180px;
  }

  #yesBtn {
    background: linear-gradient(45deg, var(--yes1), var(--yes2));
    color: white;
  }

  #noBtn {
    background: linear-gradient(45deg, var(--no1), var(--no2));
    color: white;
  }

  button:hover { transform: scale(1.05); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0,200,83,0.6); }
    70% { box-shadow: 0 0 0 20px rgba(0,200,83,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,200,83,0); }
  }

  .pulse { animation: pulse 1.5s infinite; }

  .footer {
    position: absolute;
    bottom: 8px;
    font-size: 0.8rem;
    color: #555;
  }
</style>
</head>
<body>

<div class="container">
  <img id="gif" class="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">

  <h1 id="question">Will you be my bestie? 💖</h1>
  <div id="subtext" class="subtext">Tap yes for the best ending ✨</div>

  <div class="buttons">
    <button id="yesBtn">Yes 💚</button>
    <button id="noBtn">No 😶</button>
  </div>
</div>

<div class="footer">Built by Mithun 💻✨</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const gif = document.getElementById("gif");
const question = document.getElementById("question");
const subtext = document.getElementById("subtext");

let clickCount = 0;
let yesScale = 1;
let escapeMode = false;

const lines = [
  "You'll miss me 😌",
  "Life is boring without me 👀",
  "You know I'm fun right 😏",
  "Don't do this mistake 😭",
  "You'll regret saying no 😤",
  "I'm kinda unforgettable 😎"
];

const gifs = [
  "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
  "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/26BRuo6sLetdllPAQ/giphy.gif",
  "https://media.giphy.com/media/3oriO6qJiXajN0TyDu/giphy.gif",
  "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif"
];

function vibrate(){ if(navigator.vibrate) navigator.vibrate(30); }

yesBtn.onclick = () => {
  vibrate();
  question.innerText = "Yayyy! Best decision ever 😄💖";
  subtext.innerText = "You just made the cutest choice ✨";
  alert("Now you can't ignore me 😌💖");
};

noBtn.onclick = () => {
  vibrate();
  if(escapeMode) return;

  clickCount++;
  gif.src = gifs[clickCount % gifs.length];

  if(clickCount === 1){
    noBtn.innerText = "Are you sure?";
  }
  else if(clickCount <= 6){
    noBtn.innerText = lines[clickCount-2];
  }

  if(clickCount === 6){
    subtext.innerText = "Okay last chance… you’ll actually miss me 😶";
  }

  yesScale += 0.25;
  yesBtn.style.transform = `scale(${yesScale})`;

  if(yesScale > 1.8){ yesBtn.classList.add("pulse"); }

  if(clickCount > 6){
    escapeMode = true;
    noBtn.innerText = "No 😤";
    noBtn.style.position = "fixed";
  }
};

// ESCAPE LOGIC
document.addEventListener("pointermove", (e)=>{
  if(!escapeMode) return;

  const rect = noBtn.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width/2);
  const dy = e.clientY - (rect.top + rect.height/2);
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 140){
    const x = Math.random()*(window.innerWidth - rect.width);
    const y = Math.random()*(window.innerHeight - rect.height);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }
});
</script>

</body>
</html>
